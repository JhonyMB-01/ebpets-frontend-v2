<mat-toolbar class="navbar">

  <!-- Brand -->
  <div class="brand">

    <mat-icon class="brand-icon">
      pets
    </mat-icon>

    <span class="brand-title">
      EBPETS
    </span>

  </div>

  <span class="spacer"></span>

  <!-- User -->
  <div class="user-section">

    <div class="user-info">

      <span class="username">
        {{ username }}
      </span>

      <span class="role">
        {{ role }}
      </span>

    </div>

    <button
      mat-icon-button
      class="profile-btn">

      <mat-icon>account_circle</mat-icon>

    </button>

    <button
      mat-icon-button
      class="logout-btn"
      (click)="logout()">

      <mat-icon>logout</mat-icon>

    </button>

  </div>

</mat-toolbar>
