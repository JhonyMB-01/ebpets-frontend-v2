<div class="page">

  <!-- HEADER -->
  <div class="page-header">
    <h1>Productos</h1>

    <button
      mat-raised-button
      color="primary"
      (click)="nuevoProducto()">

      <mat-icon>add</mat-icon>
      Nuevo Producto
    </button>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Cargando productos...
  </div>

  <!-- TABLA -->
  <mat-card *ngIf="!loading">

    <table mat-table [dataSource]="dataSource">

      <!-- Código -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let p"> {{ p.codigo }} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef> Categoría </th>
        <td mat-cell *matCellDef="let p">{{ p.categoria?.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="marca">
        <th mat-header-cell *matHeaderCellDef> Marca </th>
        <td mat-cell *matCellDef="let p">{{ p.marca?.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="precioVenta">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let p">
          S/ {{ p.precioVenta }}
        </td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let p">
          <span class="activo" *ngIf="p.activo">Activo</span>
          <span class="inactivo" *ngIf="!p.activo">Inactivo</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="primary" (click)="editarProducto(p)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- FILAS -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card>

</div>
