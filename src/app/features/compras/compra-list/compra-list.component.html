<div class="compras-page">

  <!-- HEADER -->
  <div class="page-header">

    <div class="title-section">
      <h1 class="page-title">
        Compras
      </h1>

      <p class="page-subtitle">
        Gestiona las compras registradas
      </p>
    </div>

    <button
      mat-flat-button
      color="primary"
      class="new-btn"
      (click)="nuevaCompra()">

      <mat-icon>add</mat-icon>
      Nueva Compra

    </button>

  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading-state">

    <mat-spinner diameter="40"></mat-spinner>

    <span>Cargando compras...</span>

  </div>

  <!-- TABLE -->
  <mat-card *ngIf="!loading" class="table-card">

    <div class="table-wrapper">

      <table mat-table [dataSource]="dataSource" class="compras-table">

        <!-- ID COMPRA -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Compra</th>

          <td mat-cell *matCellDef="let c">

            <span class="compra-code">
              #{{ c.id }}
            </span>

          </td>
        </ng-container>

        <!-- PROVEEDOR -->
        <ng-container matColumnDef="proveedor">
          <th mat-header-cell *matHeaderCellDef>Proveedor</th>

          <td mat-cell *matCellDef="let c">

            <div class="proveedor-cell">

              <div class="avatar">
                {{ c.proveedor?.charAt(0) }}
              </div>

              <span>
                {{ c.proveedor }}
              </span>

            </div>

          </td>
        </ng-container>

        <!-- FECHA -->
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>

          <td mat-cell *matCellDef="let c">

            {{ c.fecha | date:'dd/MM/yyyy HH:mm' }}

          </td>
        </ng-container>

        <!-- TOTAL -->
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>

          <td mat-cell *matCellDef="let c">

            <span class="total">
              S/ {{ c.total }}
            </span>

          </td>
        </ng-container>

        <!-- ACCIONES -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>

          <td mat-cell *matCellDef="let c">

            <div class="actions">

              <button
                mat-icon-button
                color="primary"
                matTooltip="Ver detalle"
                (click)="verDetalle(c.id)">

                <mat-icon>visibility</mat-icon>

              </button>

            </div>

          </td>
        </ng-container>

        <!-- ROWS -->

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns">
        </tr>

      </table>

      <!-- EMPTY -->

      <div *ngIf="dataSource.data.length === 0" class="empty-state">

        <mat-icon>shopping_cart</mat-icon>

        <h3>No hay compras registradas</h3>

        <p>Realiza la primera compra del sistema</p>

      </div>

    </div>

  </mat-card>

</div>
