<div class="categories-page">

  <!-- HEADER -->

  <div class="page-header">

    <div class="title-section">

      <h1 class="page-title">
        Categorías
      </h1>

      <p class="page-subtitle">
        Gestiona las categorías del sistema
      </p>

    </div>

    <button
      mat-flat-button
      color="primary"
      class="new-category-btn"
      (click)="nuevo()"
    >

      <mat-icon>
        add
      </mat-icon>

      Nueva Categoría

    </button>

  </div>

  <!-- LOADING -->

  <div
    *ngIf="loading"
    class="loading-state"
  >

    <mat-spinner diameter="40"></mat-spinner>

    <span>
      Cargando categorías...
    </span>

  </div>

  <!-- TABLE -->

  <mat-card
    *ngIf="!loading"
    class="table-card"
  >

    <!-- TOOLBAR (opcional futuro search) 

    <div class="table-toolbar">

      <mat-form-field
        appearance="outline"
        class="search-field"
      >

        <mat-label>
          Buscar categoría
        </mat-label>

        <mat-icon matPrefix>
          search
        </mat-icon>

        <input matInput placeholder="Ej: Alimentos, Higiene...">

      </mat-form-field>

    </div>-->

    <div class="table-wrapper">

      <table
        mat-table
        [dataSource]="dataSource"
        class="categories-table"
      >

        <!-- NOMBRE -->

        <ng-container matColumnDef="nombre">

          <th mat-header-cell *matHeaderCellDef>
            Categoría
          </th>

          <td mat-cell *matCellDef="let c">

            <div class="category-cell">

              <div class="category-avatar">

                {{ c.nombre.charAt(0) }}

              </div>

              <span class="category-name">
                {{ c.nombre }}
              </span>

            </div>

          </td>

        </ng-container>

        <!-- DESCRIPCIÓN -->

        <ng-container matColumnDef="descripcion">

          <th mat-header-cell *matHeaderCellDef>
            Descripción
          </th>

          <td mat-cell *matCellDef="let c">

            <span class="description-text">
              {{ c.descripcion }}
            </span>

          </td>

        </ng-container>

        <!-- ACCIONES -->

        <ng-container matColumnDef="acciones">

          <th mat-header-cell *matHeaderCellDef>
            Acciones
          </th>

          <td mat-cell *matCellDef="let c">

            <div class="actions-container">

              <!-- EDITAR -->

              <button
                mat-icon-button
                class="action-btn edit-btn"
                matTooltip="Editar categoría"
                (click)="editar(c)"
              >

                <mat-icon>
                  edit
                </mat-icon>

              </button>

              <!-- ELIMINAR -->

              <button
                mat-icon-button
                class="action-btn delete-btn"
                matTooltip="Eliminar categoría"
                (click)="eliminar(c)"
              >

                <mat-icon>
                  delete
                </mat-icon>

              </button>

            </div>

          </td>

        </ng-container>

        <!-- ROWS -->

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns;"
        ></tr>

      </table>

      <!-- EMPTY STATE -->

      <div
        *ngIf="dataSource.data.length === 0"
        class="empty-state"
      >

        <mat-icon>
          category
        </mat-icon>

        <h3>
          No hay categorías registradas
        </h3>

        <p>
          Crea tu primera categoría para organizar productos
        </p>

      </div>

    </div>

  </mat-card>

</div>
