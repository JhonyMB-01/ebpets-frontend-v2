<div class="page">

  <div class="header">
    <h1>Categorías</h1>

    <button mat-raised-button color="primary" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nueva Categoría
    </button>
  </div>
  
  <div *ngIf="loading" class="loading">
    Cargando categorías...
  </div>

  <!-- TABLA -->
  <mat-card *ngIf="!loading">

    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let c">{{ c.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones</th>
        <td mat-cell *matCellDef="let c">

          <button mat-icon-button (click)="editar(c)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="eliminar(c)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

       <!-- FILAS -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card>

</div>
