<p>metric-card works!</p>
<mat-card class="metric-card" [ngClass]="metric.type">

  <mat-icon class="metric-icon">
    {{ metric.icon }}
  </mat-icon>

  <div class="metric-content">
    <span class="metric-label">{{ metric.label }}</span>
    <span class="metric-value">{{ metric.value }}</span>
  </div>

</mat-card>
