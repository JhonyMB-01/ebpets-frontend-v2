<div class="ventas-page">

  <!-- HEADER -->
  <div class="page-header">

    <div>
      <h1 class="title">Ventas</h1>
      <p class="subtitle">Gestión de ventas registradas</p>
    </div>

    <button mat-flat-button color="primary" (click)="nuevaVenta()">
      <mat-icon>add</mat-icon>
      Nueva Venta
    </button>

  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando ventas...</span>
  </div>

  <!-- TABLA -->
  <mat-card *ngIf="!loading" class="table-card">

    <div class="table-wrapper">

      <table mat-table [dataSource]="dataSource" class="ventas-table">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Venta</th>

          <td mat-cell *matCellDef="let v">
            <span class="venta-id">#{{ v.id }}</span>
          </td>
        </ng-container>

        <!-- CLIENTE -->
        <ng-container matColumnDef="cliente">
          <th mat-header-cell *matHeaderCellDef>Cliente</th>

          <td mat-cell *matCellDef="let v">
            {{ v.cliente }}
          </td>
        </ng-container>

        <!-- VENDEDOR -->
        <ng-container matColumnDef="vendedor">
          <th mat-header-cell *matHeaderCellDef>Vendedor</th>

          <td mat-cell *matCellDef="let v">
            {{ v.vendedor }}
          </td>
        </ng-container>

        <!-- FECHA -->
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>

          <td mat-cell *matCellDef="let v">
            {{ v.fecha | date:'dd/MM/yyyy HH:mm' }}
          </td>
        </ng-container>

        <!-- TOTAL -->
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>

          <td mat-cell *matCellDef="let v">
            <span class="total">S/ {{ v.total }}</span>
          </td>
        </ng-container>

        <!-- ESTADO -->
        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>

          <td mat-cell *matCellDef="let v">

            <span
              class="estado"
              [ngClass]="v.estado">

              {{ v.estado }}

            </span>

          </td>
        </ng-container>

        <!-- ACCIONES -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>

          <td mat-cell *matCellDef="let v">
            <div class="actions-container">

           <!-- VER DETALLE -->

            <button
              mat-icon-button
              color="primary"
              (click)="verDetalle(v.id)">

              <mat-icon>visibility</mat-icon>

            </button>

            <!-- APROBAR PAGO -->

              <button
              *ngIf="v.estado === 'PENDIENTE'"
              mat-icon-button
              class="action-btn approve-btn"
              matTooltip="Aprobar pago"
              (click)="aprobarPago(v.id)"
            >
              <mat-icon>check_circle</mat-icon>
            </button>

             </div>

          </td>
        </ng-container>

        <!-- ROWS -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

      <!-- EMPTY -->
      <div *ngIf="dataSource.data.length === 0" class="empty">
        <mat-icon>receipt</mat-icon>
        <p>No hay ventas registradas</p>
      </div>

    </div>

  </mat-card>

</div>
