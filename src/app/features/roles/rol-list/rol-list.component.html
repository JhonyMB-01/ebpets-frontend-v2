<div class="brands-page">

  <!-- HEADER -->

  <div class="page-header">

    <div class="title-section">

      <h1 class="page-title">
        Roles
      </h1>

      <p class="page-subtitle">
        Gestiona los roles registrados
      </p>

    </div>

    <button
      mat-flat-button
      color="primary"
      class="new-brand-btn"
      (click)="nuevo()"
    >

      <mat-icon>
        add
      </mat-icon>

      Nuevo Rol

    </button>

  </div>

  <!-- LOADING -->

  <div
    *ngIf="loading"
    class="loading-state"
  >

    <mat-spinner diameter="40"></mat-spinner>

    <span>
      Cargando roles...
    </span>

  </div>

  <!-- TABLE -->

  <mat-card
    *ngIf="!loading"
    class="table-card"
  >

    <!-- TOOLBAR 

    <div class="table-toolbar">

      <mat-form-field
        appearance="outline"
        class="search-field"
      >

        <mat-label>
          Buscar rol
        </mat-label>

        <mat-icon matPrefix>
          search
        </mat-icon>

        <input
          matInput
          placeholder="Ingrese el nombre"
        >

      </mat-form-field>

    </div>-->

    <!-- TABLE -->

    <div class="table-wrapper">

      <table
        mat-table
        [dataSource]="dataSource"
        class="brands-table"
      >

        <!-- NOMBRE -->

        <ng-container matColumnDef="nombre">

          <th mat-header-cell *matHeaderCellDef>
            Rol
          </th>

          <td mat-cell *matCellDef="let c">

            <div class="brand-cell">

              <div class="brand-avatar">

                {{ c.nombre.charAt(0) }}

              </div>

              <div class="brand-info">

                <span class="brand-name">
                  {{ c.nombre }}
                </span>

              </div>

            </div>

          </td>

        </ng-container>

        <!-- ACCIONES -->

        <ng-container matColumnDef="acciones">

          <th mat-header-cell *matHeaderCellDef>
            Acciones
          </th>

          <td mat-cell *matCellDef="let c">

            <div class="actions-container">

              <!-- DELETE -->

              <button
                mat-icon-button
                class="action-btn delete-btn"
                matTooltip="Eliminar rol"
                (click)="eliminar(c)"
              >

                <mat-icon>
                  delete
                </mat-icon>

              </button>

            </div>

          </td>

        </ng-container>

        <!-- ROWS -->

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns;"
        ></tr>

      </table>

      <!-- EMPTY STATE -->

      <div
        *ngIf="dataSource.data.length === 0"
        class="empty-state"
      >

        <mat-icon>
          storefront
        </mat-icon>

        <h3>
          No hay roles registrados
        </h3>

        <p>
          Agrega tu primer rol para comenzar
        </p>

      </div>

    </div>

  </mat-card>

</div>
