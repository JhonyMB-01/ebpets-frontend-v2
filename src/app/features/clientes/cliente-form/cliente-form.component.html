<mat-card class="provider-form-card">

  <!-- Header -->

  <div class="card-header">

    <div class="title-section">

      <mat-icon class="header-icon">
        business
      </mat-icon>

      <div>
        <h2 class="form-title">
          {{ modoEdicion ? 'Editar Cliente' : 'Nuevo Cliente' }}
        </h2>

        <p class="form-subtitle">
          Completa la información del Cliente
        </p>
      </div>

    </div>

  </div>

  <!-- Form -->

  <form
    [formGroup]="form"
    (ngSubmit)="guardar()"
    class="provider-form"
  >

    <div class="form-grid">

      <!-- Nombre -->

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>

        <mat-icon matPrefix>
          badge
        </mat-icon>

        <input
          matInput
          formControlName="nombre"
          placeholder="Ingrese el nombre"
          appInputFilter="letters"
        >
      </mat-form-field>

      <!-- DOCUMENTO -->

      <mat-form-field appearance="outline">

        <mat-label>Documento</mat-label>

        <mat-icon matPrefix>
          receipt_long
        </mat-icon>

        <input
          matInput
          formControlName="documento"
          placeholder="Ingrese el número de documento"
          appInputFilter="document"
        >

      </mat-form-field>

      <!-- Teléfono -->

      <mat-form-field appearance="outline">

        <mat-label>Teléfono</mat-label>

        <mat-icon matPrefix>
          phone
        </mat-icon>

        <input
          matInput
          formControlName="telefono"
          placeholder="Ingrese el teléfono"
          appInputFilter="cellphone"
        >

      </mat-form-field>

      <!-- Correo -->

      <mat-form-field appearance="outline">

        <mat-label>Correo Electrónico</mat-label>

        <mat-icon matPrefix>
          email
        </mat-icon>

        <input
          matInput
          formControlName="email"
          type="email"
          placeholder="correo@empresa.com"
        >

      </mat-form-field>

    </div>

    <!-- Actions -->

    <div class="form-actions">

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="save-btn"
         [disabled]="form.invalid"
      >

        <mat-icon>save</mat-icon>
        Guardar

      </button>

      <button
        mat-stroked-button
        type="button"
        class="cancel-btn"
        (click)="cancelar()"
      >

        <mat-icon>close</mat-icon>
        Cancelar

      </button>

    </div>

  </form>

</mat-card>
