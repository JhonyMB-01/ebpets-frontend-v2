<div class="confirm-dialog">

  <!-- HEADER -->

  <div class="dialog-header">

    <div class="icon-wrapper danger">

      <mat-icon>
        warning
      </mat-icon>

    </div>

    <div class="title-content">

      <h2 class="dialog-title">
        Confirmar acción
      </h2>

      <p class="dialog-subtitle">
        Esta acción no se puede deshacer
      </p>

    </div>

  </div>

  <!-- CONTENT -->

  <mat-dialog-content class="dialog-content">

    <p class="message">
      {{ data.mensaje }}
    </p>

  </mat-dialog-content>

  <!-- ACTIONS -->

  <mat-dialog-actions class="dialog-actions" align="end">

    <button
      mat-stroked-button
      class="cancel-btn"
      (click)="cancelar()"
    >

      Cancelar

    </button>

    <button
      mat-flat-button
      color="warn"
      class="confirm-btn"
      (click)="confirmar()"
    >

      <mat-icon>
        delete
      </mat-icon>

      Eliminar

    </button>

  </mat-dialog-actions>

</div>
